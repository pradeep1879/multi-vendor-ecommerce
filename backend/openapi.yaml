openapi: 3.1.0
info:
  title: Multi-Vendor Marketplace API
  version: 1.0.0
  description: |
    Maintained API specification. Domain endpoints are added in their implementation phases.
    All business amounts use integer INR paise. Errors use the shared error envelope.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      responses:
        '200':
          description: Process is responding.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: marketplace-api }
  /health/ready:
    get:
      summary: Database readiness check
      operationId: getReadiness
      responses:
        '200':
          description: Required database dependency is reachable.
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1:
    get:
      summary: API version information
      operationId: getApiVersion
      responses:
        '200':
          description: Versioned API envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /api/v1/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Versioned API fallback
      operationId: unknownVersionedRoute
      responses:
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/register:
    post:
      summary: Register a customer account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128 }
                name: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '201':
          description: Customer created; refresh token is set in an HttpOnly cookie.
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/login:
    post:
      summary: Create a customer session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Access token and public user; refresh token is set in an HttpOnly cookie. }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh session
      operationId: refreshSession
      description: Requires a configured Origin and marketplace_refresh cookie. Reuse revokes the token family.
      responses:
        '200': { description: New access token and rotated HttpOnly cookie. }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current refresh session
      operationId: logout
      responses:
        '204': { description: Session revoked and cookie cleared. }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/logout-all:
    post:
      summary: Revoke all sessions for the current user
      operationId: logoutAll
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sessions revoked and cookie cleared. }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/password-reset:
    post:
      summary: Request a password reset email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted without revealing whether the account exists. }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/password-reset/confirm:
    post:
      summary: Complete a password reset
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 32, maxLength: 256 }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200': { description: Password updated and existing sessions revoked. }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/email-verification:
    post:
      summary: Request an email verification link
      operationId: requestEmailVerification
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Verification email accepted. }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/auth/email-verification/confirm:
    post:
      summary: Confirm an email verification token
      operationId: confirmEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 256 }
      responses:
        '200': { description: Email verified. }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/me:
    get:
      summary: Read the authenticated user
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Public user profile and role grants. }
        '401': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Update the authenticated user's profile
      operationId: updateCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated public user profile. }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/me/addresses:
    get:
      summary: List addresses owned by the authenticated user
      operationId: listAddresses
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Customer-owned addresses. }
    post:
      summary: Add an address to the authenticated user's account
      operationId: createAddress
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Address created. }
  /api/v1/me/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update an owned address
      operationId: updateAddress
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Address updated. }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Delete an owned address
      operationId: deleteAddress
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Address deleted. }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/vendor-applications:
    post:
      summary: Submit a vendor application
      operationId: submitVendorApplication
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Application queued for administrative review. }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/vendor-applications/me:
    get:
      summary: Read the current user's latest vendor application
      operationId: getMyVendorApplication
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Latest application or null. }
  /api/v1/admin/vendor-applications:
    get:
      summary: List vendor applications for administrators
      operationId: listVendorApplications
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Bounded page of vendor applications. }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/vendor-applications/{applicationId}/{decision}:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: decision
        in: path
        required: true
        schema: { type: string, enum: [approve, reject] }
    post:
      summary: Approve or reject a pending vendor application
      operationId: decideVendorApplication
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Decision recorded with reviewer and reason. }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/vendors/{vendorId}/suspend:
    post:
      summary: Suspend an approved vendor
      operationId: suspendVendor
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Vendor suspended with an audit reason. }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/vendor:
    get:
      summary: Read the authenticated vendor's approved store profile
      operationId: getVendorProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owner's approved vendor store. }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Update the authenticated vendor's approved store profile
      operationId: updateVendorProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated store profile. }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/orders/{orderId}/payment:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Create or return the provider payment order for an owned order
      operationId: initiateOrderPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 160 }
      responses:
        '201': { description: Provider order and server-calculated amount. }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
    get:
      summary: Read the authenticated customer's payment status for an order
      operationId: getOrderPayment
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Payment and latest attempt status. }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/payments/verify:
    post:
      summary: Verify provider callback data server-side
      operationId: verifyPaymentCallback
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerOrderId, providerPaymentId, signature]
              properties:
                providerOrderId: { type: string, maxLength: 160 }
                providerPaymentId: { type: string, maxLength: 160 }
                signature: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '200': { description: Provider status verified and payment reconciled. }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/payments/webhook:
    post:
      summary: Receive a raw-body signed payment provider webhook
      operationId: receivePaymentWebhook
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: false
          schema: { type: string }
        - name: X-Razorpay-Event-Id
          in: header
          required: false
          schema: { type: string }
      responses:
        '200': { description: Event durably recorded or identified as a duplicate. }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/orders/{orderId}/refunds:
    post:
      summary: Request an idempotent partial or full refund for an order
      operationId: requestOrderRefund
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 160 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountPaise, reason]
              properties:
                amountPaise: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '201': { description: Refund requested from provider; status reflects provider confirmation. }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/settlements/batch:
    post:
      summary: Create the weekly batch of delivered eligible vendor balances
      operationId: createSettlementBatch
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Pending vendor settlements were created idempotently. }
  /api/v1/admin/settlements/{settlementId}/transfer:
    post:
      summary: Initiate a provider transfer for a settlement
      operationId: initiateSettlementTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: settlementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Transfer is processing and remains unsettled until provider confirmation. }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/vendor/settlements:
    get:
      summary: List settlements for the authenticated vendor only
      operationId: listVendorSettlements
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owner-scoped settlement records. }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/payments/reconciliation:
    get:
      summary: Report local payment, settlement, webhook, refund, and ledger discrepancies
      operationId: getPaymentReconciliationReport
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reconciliation summary for the previous 30 days. }
  /api/v1/admin/analytics/summary:
    get:
      summary: Read platform aggregates for a UTC date window
      operationId: getAdminAnalyticsSummary
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paid GMV, refunds, commission, payable, active counts, and order statuses. }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/vendor/analytics/summary:
    get:
      summary: Read aggregates for the authenticated vendor and UTC date window
      operationId: getVendorAnalyticsSummary
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Vendor order count, payable and commission totals. }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/settlements:
    get:
      summary: List vendor settlement batches
      operationId: listAdminSettlements
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated or bounded settlement records. }
components:
  schemas:
    VersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [service, version]
          properties:
            service: { type: string, const: marketplace-api }
            version: { type: string, const: v1 }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }
  responses:
    ErrorResponse:
      description: Consistent API error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
